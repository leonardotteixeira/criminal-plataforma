[project]
name = "sinalbr-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5.6", "fastapi>=0.115", "httpx>=0.28.1", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
